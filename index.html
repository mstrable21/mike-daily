        <label>
            <input type="checkbox">
        Did you eat morning banana with Cipher?
        </label>

        </label>
    </div>

        <label>
             <input type="checkbox">
             Did you do or say something nice to yourself?
        </label>
    </div>
    <div class="goal">
        <label>
             <input type="checkbox">
             Did you do something good for someone else?
        </label>
    </div>
    <div class="goal">

             <input type="checkbox">

        </label>
